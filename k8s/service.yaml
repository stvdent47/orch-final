apiVersion: v1
kind: Service
metadata:
  name: sentiment-analyzer-service
  namespace: sentiment-app
  labels:
    app: sentiment-analyzer
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: LoadBalancer
  selector:
    app: sentiment-analyzer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-analyzer-internal
  namespace: sentiment-app
  labels:
    app: sentiment-analyzer
spec:
  type: ClusterIP
  selector:
    app: sentiment-analyzer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
